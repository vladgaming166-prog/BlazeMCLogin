# =============================================================================
# BlazeMCLogin — Premium auto-login
# Requires BlazeMC Connection Detector on Velocity PLUS the BlazeMCLogin
# Velocity bridge. Paper never classifies Premium from UUID format, IP,
# client brand, or unsigned plugin messages.
#
# Leave shared-secret empty to use the Velocity modern-forwarding secret
# already configured for the network (zero-config HMAC).
# =============================================================================
premium:
  auto-auth:
    enabled: true
    default: true
  auto-login:
    enabled: true
    success-message: true
    require-verified-identity: true
    bypass-password: true
  disable-password-login: true
  disable-registration: true
  protect-reserved-names: true
  reject-unverified-sessions: true
  bridge:
    enabled: true
    channel: blazemclogin:v1
    # Maximum age of a signed verification packet.
    max-message-age-seconds: 15
    # How long to wait after join for a signed packet before showing /login
    # or rejecting an unverified reserved name.
    wait-for-bridge-millis: 4000
    # Shared HMAC-SHA256 secret. Empty = Velocity forwarding.secret.
    shared-secret: ""
