# =============================================================================
# BlazeMCLogin — authentication sounds
# Keys are vanilla Minecraft sound names. Unknown keys are skipped.
# =============================================================================
sounds:
  enabled: true
  login-prompt:
    enabled: true
    sound: minecraft:block.note_block.pling
    volume: 0.8
    pitch: 1.2
  register-prompt:
    enabled: true
    sound: minecraft:block.note_block.harp
    volume: 0.7
    pitch: 0.8
  login-success:
    enabled: true
    sound: minecraft:entity.player.levelup
    volume: 0.7
    pitch: 1.2
  register-success:
    enabled: true
    sound: minecraft:entity.player.levelup
    volume: 0.9
    pitch: 1.0
  premium-auto:
    enabled: true
    sound: minecraft:entity.player.levelup
    volume: 0.85
    pitch: 1.5
  wrong-password:
    enabled: true
    sound: minecraft:entity.villager.no
    volume: 0.9
    pitch: 0.9
  auth-error:
    enabled: true
    sound: minecraft:block.note_block.bass
    volume: 0.8
    pitch: 0.6
  premium-denied:
    enabled: true
    sound: minecraft:entity.villager.no
    volume: 1.0
    pitch: 0.7
  connected:
    enabled: true
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.7
    pitch: 1.1
