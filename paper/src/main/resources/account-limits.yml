# =============================================================================
# BlazeMCLogin — IP account limits
# IPs are stored as HMAC-SHA256 hashes, not plaintext.
# whitelist / blacklist accept literal IPv4, IPv6, or already-hashed values.
# max-accounts-per-ip: 0 means unlimited.
# =============================================================================
account-limits:
  enabled: true
  max-accounts-per-ip: 3
  count-premium-accounts: true
  count-cracked-accounts: true
  exempt-permissions:
    - blazemclogin.bypass.iplimit
  whitelist: []
  blacklist: []
